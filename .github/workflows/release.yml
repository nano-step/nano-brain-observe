name: Release

# Every push to main (i.e. every merged PR) is released: version computed
# from the date, binaries attached to a GitHub release, npm packages published
# through npm trusted publishing (OIDC, no token). Put [skip-release] in the
# commit message to opt out.
on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: "!contains(github.event.head_commit.message, '[skip-release]')"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test
        run: test -z "$(gofmt -l .)" && go vet ./... && go test -race -count=1 ./...

      # Version is {YYYY}.{M}.{D*100+N}: N is the 1-based release number of the
      # day. No segment ever has a leading zero, so the git tag (v + version)
      # and the npm version are the same string, and order is monotonic.
      - name: Compute version
        id: ver
        run: |
          set -euo pipefail
          prefix="$(date -u +%Y).$(date -u +%-m)"
          day=$(date -u +%-d)
          last=$(git tag --list "v${prefix}.*" | sed -E "s/^v${prefix}\.//" | grep -E '^[0-9]+$' \
            | awk -v d="$day" '$1 > d*100 && $1 < (d+1)*100' | sort -n | tail -1 || true)
          next=$(( ${last:-$((day * 100))} + 1 ))
          if [ "$next" -ge $(( (day + 1) * 100 )) ]; then
            echo "more than 99 releases today" >&2
            exit 1
          fi
          echo "version=${prefix}.${next}" >> "$GITHUB_OUTPUT"
          echo "Releasing v${prefix}.${next}"

      - name: Build binaries
        env:
          VERSION: v${{ steps.ver.outputs.version }}
        run: |
          mkdir dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            goos=${target%/*}; goarch=${target#*/}; ext=""
            if [ "$goos" = windows ]; then ext=.exe; fi
            GOOS=$goos GOARCH=$goarch CGO_ENABLED=0 go build -trimpath \
              -ldflags="-s -w -X main.Version=${VERSION}" \
              -o "dist/nano-brain-observe-${goos}-${goarch}${ext}" ./cmd/nano-brain-observe
          done
          cd dist && sha256sum nano-brain-observe-* > SHA256SUMS

      - name: Create tag and release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: dist/*
          fail_on_unmatched_files: true

  npm-publish:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm >= 11.5.1.
      - name: Update npm
        run: npm install -g npm@latest

      - name: Set version
        run: npm version --no-git-tag-version "${{ needs.release.outputs.version }}"

      - name: Publish @nano-step/nano-brain-observe
        run: npm publish --access public

      - name: Publish nano-brain-observe (unscoped alias)
        run: |
          node -e "const p=require('./package.json'); p.name='nano-brain-observe'; delete p.publishConfig; require('fs').writeFileSync('package.json',JSON.stringify(p,null,2)+'\n')"
          npm publish
