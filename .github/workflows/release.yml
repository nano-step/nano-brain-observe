name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test
        run: go vet ./... && go test -race -count=1 ./...

      - name: Build binaries
        run: |
          mkdir dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            goos=${target%/*}; goarch=${target#*/}; ext=""
            if [ "$goos" = windows ]; then ext=.exe; fi
            GOOS=$goos GOARCH=$goarch CGO_ENABLED=0 go build -trimpath \
              -ldflags="-s -w -X main.Version=${GITHUB_REF_NAME}" \
              -o "dist/nano-brain-observe-${goos}-${goarch}${ext}" ./cmd/nano-brain-observe
          done
          cd dist && sha256sum nano-brain-observe-* > SHA256SUMS

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
          fail_on_unmatched_files: true

  npm-publish:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pinned to v4: v5 breaks classic NPM_TOKEN publish (actions/setup-node#1551).
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Set version from git tag
        run: npm version --no-git-tag-version "${GITHUB_REF_NAME#v}"

      - name: Publish @nano-step/nano-brain-observe
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish nano-brain-observe (unscoped alias)
        run: |
          node -e "const p=require('./package.json'); p.name='nano-brain-observe'; delete p.publishConfig; require('fs').writeFileSync('package.json',JSON.stringify(p,null,2)+'\n')"
          npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
